name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: canary
        type: choice
        options:
          - canary
          - latest

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm packages:build
          pnpm packages:publint
          pnpm packages:smoke
          pnpm packages:check
          pnpm cloudflare:check
          pnpm tsc
          pnpm lint
          pnpm test:run

      - name: Verify release version
        id: release-version
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')

          const packages = fs.readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .flatMap((entry) => {
              const path = `packages/${entry.name}/package.json`
              if (!fs.existsSync(path)) return []
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
              return pkg.name?.startsWith('@yolk-sdk/') && pkg.private !== true ? [pkg] : []
            })

          const versions = [...new Set(packages.map((pkg) => pkg.version))]
          if (versions.length !== 1) {
            throw new Error(`Public package versions are not lockstep: ${versions.join(', ')}`)
          }

          const publishedPackages = []
          const unpublishedPackages = []

          for (const pkg of packages) {
            let published = []
            try {
              published = JSON.parse(execFileSync('npm', ['view', pkg.name, 'versions', '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }))
            } catch (error) {
              published = []
            }
            const publishedVersions = Array.isArray(published) ? published : [published]
            if (publishedVersions.includes(pkg.version)) {
              publishedPackages.push(`${pkg.name}@${pkg.version}`)
            } else {
              unpublishedPackages.push(`${pkg.name}@${pkg.version}`)
            }
          }

          if (publishedPackages.length > 0) {
            console.log(`Already published:\n${publishedPackages.map((pkg) => `- ${pkg}`).join('\n')}`)
          }
          if (unpublishedPackages.length > 0) {
            console.log(`Packages to publish:\n${unpublishedPackages.map((pkg) => `- ${pkg}`).join('\n')}`)
          } else {
            console.log(`All packages already published for ${versions[0]}; will only ensure git tag exists`)
          }

          const tag = `v${versions[0]}`
          const refs = execFileSync('git', ['ls-remote', '--tags', 'origin', tag], { encoding: 'utf8' }).trim()
          if (refs.length > 0) {
            throw new Error(`${tag} already exists`)
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${versions[0]}\n`)
          NODE

      - name: Pack packages
        run: |
          mkdir -p .release
          pnpm -r --filter './packages/*' pack --pack-destination "$PWD/.release"

      - name: Publish tarballs
        env:
          NPM_CONFIG_PROVENANCE: false
        run: |
          for tarball in .release/*.tgz; do
            package_spec="$(tar -xOf "$tarball" package/package.json | node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync(0, 'utf8')); if (typeof pkg.name !== 'string' || typeof pkg.version !== 'string') throw new Error('tarball package.json missing name/version'); process.stdout.write(pkg.name + '@' + pkg.version)")"
            if npm view "$package_spec" version --json >/dev/null 2>&1; then
              echo "Skipping already-published $package_spec"
              continue
            fi
            npm publish "$tarball" --tag "${{ inputs.tag }}" --access public --provenance=false
          done

      - name: Tag published version
        run: |
          version="${{ steps.release-version.outputs.version }}"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
