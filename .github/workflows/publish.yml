name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: canary
        type: choice
        options:
          - canary
          - latest

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm packages:build
          pnpm packages:publint
          pnpm packages:smoke
          pnpm packages:check
          pnpm cloudflare:check
          pnpm tsc
          pnpm lint
          pnpm test:run

      - name: Verify release version
        id: release-version
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')

          const packages = fs.readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .flatMap((entry) => {
              const path = `packages/${entry.name}/package.json`
              if (!fs.existsSync(path)) return []
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
              return pkg.name?.startsWith('@yolk-sdk/') && pkg.private !== true ? [pkg] : []
            })

          const versions = [...new Set(packages.map((pkg) => pkg.version))]
          if (versions.length !== 1) {
            throw new Error(`Public package versions are not lockstep: ${versions.join(', ')}`)
          }

          for (const pkg of packages) {
            let published = []
            try {
              published = JSON.parse(execFileSync('npm', ['view', pkg.name, 'versions', '--json'], { encoding: 'utf8' }))
            } catch (error) {
              published = []
            }
            if (published.includes(pkg.version)) {
              throw new Error(`${pkg.name}@${pkg.version} already exists on npm; run changeset version first`)
            }
          }

          const tag = `v${versions[0]}`
          const refs = execFileSync('git', ['ls-remote', '--tags', 'origin', tag], { encoding: 'utf8' }).trim()
          if (refs.length > 0) {
            throw new Error(`${tag} already exists`)
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${versions[0]}\n`)
          NODE

      - name: Pack packages
        run: |
          mkdir -p .release
          pnpm -r --filter './packages/*' pack --pack-destination "$PWD/.release"

      - name: Publish tarballs
        env:
          NPM_CONFIG_PROVENANCE: false
        run: |
          for tarball in .release/*.tgz; do
            npm publish "$tarball" --tag "${{ inputs.tag }}" --access public --provenance=false
          done

      - name: Tag published version
        run: |
          version="${{ steps.release-version.outputs.version }}"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
