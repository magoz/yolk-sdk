packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
  - 'cloudflare/*'
catalog:
  '@effect/language-service': ^0.87.4
  '@effect/opentelemetry': 4.0.5
  '@effect/platform-bun': 4.0.5
  '@effect/platform-node': 4.0.5
  '@effect/sql-pg': 4.0.5
  '@effect/vitest': 4.0.5
  effect: 4.0.5
  typescript: ^5.9.3
  vitest: ^5.0.1
allowBuilds:
  '@mongodb-js/zstd': false
  '@nestjs/core': false
  '@swc/core': true
  cbor-extract: false
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  '@effect/platform-node-shared': 4.0.5
  # 2.0.0 (like beta.6) imports S3 commands absent from the older lockfile resolution.
  '@effect-aws/client-s3>@aws-sdk/client-s3': 3.1132.0
patchedDependencies:
  'drizzle-orm@1.0.0-rc.5-ab785fc': patches/drizzle-orm@1.0.0-rc.5-ab785fc.patch
